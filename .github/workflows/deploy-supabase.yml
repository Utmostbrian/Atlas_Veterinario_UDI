name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dlwylualkahmcpexfwic
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_URL" ]]; then
            echo "::warning::Skipping Supabase deploy — set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_URL repo secrets to enable automatic deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Validate DB URL
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ "$SUPABASE_DB_URL" != *.pooler.supabase.com* ]]; then
            echo "::error::SUPABASE_DB_URL must use the Supabase Session Pooler host (*.pooler.supabase.com), not the direct Postgres host."
            exit 1
          fi

      - name: Deploy database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
