<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy: la fuente de verdad vive en vercel.json (header HTTP),
      lo cual permite parametrizar el host por entorno y es preferible al meta-tag.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Atlas Farmacológico Veterinario — AV</title>
    <meta name="description" content="Atlas Farmacológico Veterinario AV · referencia clínica farmacológica con IA" />
    <meta name="theme-color" content="#DA291C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas AV" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph / link previews en redes sociales y WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Atlas Farmacológico Veterinario — AV" />
    <meta property="og:description" content="Guía clínica farmacológica veterinaria con IA · Atlas AV" />
    <meta property="og:image" content="https://atlas-veterinario-udi.vercel.app/favicon.png" />
    <meta property="og:url" content="https://atlas-veterinario-udi.vercel.app/" />
    <meta property="og:locale" content="es" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Atlas Farmacológico Veterinario — AV" />
    <meta name="twitter:description" content="Guía clínica farmacológica veterinaria con IA · Atlas AV" />
    <meta name="twitter:image" content="https://atlas-veterinario-udi.vercel.app/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- F3: cargar Google Fonts y Font Awesome sin bloquear render.
         Sistema tipográfico AV: DM Serif Display (display), IBM Plex Sans (UI/cuerpo),
         IBM Plex Mono (metadatos). El truco preload + onload baja el CSS async y lo aplica al llegar. -->
    <link rel="preload"
          href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
          as="style"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" />
    </noscript>

    <link rel="preload"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          as="style"
          crossorigin="anonymous"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            crossorigin="anonymous" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
